name: CI and Docker image

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
      - "tests/**"
      - "install.sh"
      - ".gitignore"
      - ".dockerignore"
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
      - "tests/**"
      - "install.sh"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer shell syntax check
        run: sh -n install.sh && sh -n app/bin/entrypoint.sh

      - name: PHP syntax check
        run: |
          docker run --rm -v "$PWD/app:/app:ro" php:8.3-cli-alpine sh -lc \
            "find /app -name '*.php' -print0 | xargs -0 -n1 php -l"


  regression:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build regression image
        run: docker build -t arrview-ci .
      - name: Database migration, stress, encryption and recovery tests
        run: docker run --rm -v "$PWD/tests:/tests:ro" arrview-ci php /tests/run.php
      - name: Fresh install, sync, webhook and restart persistence tests
        run: |
          chmod +x tests/smoke.sh
          ./tests/smoke.sh
      - name: Behavioural security regression tests
        run: docker run --rm -v "$PWD/tests:/tests:ro" arrview-ci php /tests/security.php
      - name: Secrets are ignored by git and docker
        run: |
          set -eu
          git check-ignore -q .env
          git check-ignore -q app/data/arrview.sqlite
          ! git check-ignore -q .env.example
          grep -qx '.env' .dockerignore
          grep -qx 'app/data' .dockerignore
          ! grep -R --line-number -E 'echo .*api_key|print.*api_key' app/public

  docker:
    if: github.event_name != 'pull_request'
    needs: [lint, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kasundigital/arrview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
